# Render Blueprint — https://render.com/docs/blueprint-spec
# Public site (Elm Land static SPA) for https://isthmus.channel.
# Attach the custom domain after the first deploy.

services:
  - type: web
    name: isthmus-channel
    runtime: static
    rootDir: isthmus_channel
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - isthmus_channel/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
