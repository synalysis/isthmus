# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render and use "Blueprint", or create services
# manually with the settings below.
#
# Note: MeshCore USB/BLE radios need a host with hardware access; Render is
# suitable for the ops UI + Nostr + RNS-over-IP side. Use Docker on a bare-metal
# or edge host when attaching companion radios.
#
# isthmus-channel is the public marketing site (Elm Land static SPA) for
# https://isthmus.channel — attach the custom domain after the first deploy.

services:
  - type: web
    name: isthmus-channel
    runtime: static
    rootDir: isthmus_channel
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: isthmus_channel/dist
    buildFilter:
      paths:
        - isthmus_channel/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: isthmus
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: isthmus-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_PATH
        value: /data/isthmus.db
      - key: FORCE_SSL
        value: "true"
      # Optional override; otherwise RENDER_EXTERNAL_HOSTNAME is used at runtime.
      - key: PHX_HOST
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ISTHMUS_VAULT_SECRET
        generateValue: true
      - key: ISTHMUS_ADMIN_NPUBS
        sync: false
      - key: POOL_SIZE
        value: "5"
